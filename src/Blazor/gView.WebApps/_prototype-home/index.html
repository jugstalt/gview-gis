<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gView – start page prototype</title>
<!--
    Throwaway prototype for the WebApps start page (AppMainPage.razor).
    Uses the tokens of gView.Razor/wwwroot/gview-theme.css (copied below) so the look carries over 1:1.
    Open the file directly in a browser; the bar at the bottom switches state, theme and branding.
-->
<style>
:root {
    --gv-bg: #f5f6f8; --gv-surface: #ffffff; --gv-surface-2: #f0f2f5; --gv-border: #e2e5ea; --gv-text: #18202b; --gv-muted: #677284;
    --gv-accent: #2563eb; --gv-accent-soft: #e7eefe; --gv-accent-hover: rgba(37,99,235,.08); --gv-accent-text: #ffffff;
    --gv-danger: #d13b3b; --gv-danger-soft: #fdecec; --gv-warn: #b7791f; --gv-warn-soft: #fff5e0; --gv-success: #1f8a4c; --gv-success-soft: #e6f6ec;
    --gv-side: #101722; --gv-side-2: #1a2331; --gv-side-text: #b8c2d1; --gv-side-active: #ffffff;
    --gv-radius: 6px;
    --gv-shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --gv-float-shadow: 0 8px 24px rgba(16,24,40,.14), 0 2px 6px rgba(16,24,40,.08);
    --gv-font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --gv-appbar-height: 40px;
    color-scheme: light;
}
[data-theme="dark"] {
    --gv-bg: #0c1017; --gv-surface: #141a23; --gv-surface-2: #1a212c; --gv-border: #273041; --gv-text: #e4e9f0; --gv-muted: #8b97a8;
    --gv-accent: #5b93ff; --gv-accent-soft: rgba(91,147,255,.14); --gv-accent-hover: rgba(91,147,255,.10); --gv-accent-text: #0c1017;
    --gv-danger: #ff6b6b; --gv-danger-soft: rgba(255,107,107,.12); --gv-warn: #f0b542; --gv-warn-soft: rgba(240,181,66,.12); --gv-success: #4ccb7f; --gv-success-soft: rgba(76,203,127,.12);
    --gv-side: #080b10; --gv-side-2: #121822; --gv-side-text: #9aa6b8;
    --gv-shadow: none;
    --gv-float-shadow: 0 8px 24px rgba(0,0,0,.5);
    color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--gv-bg); color: var(--gv-text); font-family: var(--gv-font); font-size: 14px; }
svg.i { width: 1em; height: 1em; fill: currentColor; flex: none; }

/* ---------------------------------------------------------------- app bar (as in gview-theme.css) */
.gv-appbar { position: absolute; left: 0; top: 0; right: 0; height: var(--gv-appbar-height); display: flex; align-items: center; gap: 12px;
    padding: 0 8px 0 12px; background: var(--gv-side); color: var(--gv-side-text); font-size: 13px; z-index: 5; }
.gv-appbar a { text-decoration: none; }
.gv-brand { display: flex; align-items: center; gap: 8px; color: var(--gv-side-active); white-space: nowrap; }
.gv-brand-mark { width: 24px; height: 24px; padding: 4px; border-radius: 6px; background: var(--gv-accent); color: #fff; }
.gv-brand em { font-style: normal; font-size: 11px; opacity: .8; color: var(--gv-side-text); }
.gv-appbar-center { flex: 1; }
.gv-appbar-right { display: flex; align-items: center; gap: 2px; }
.gv-appbar-btn, .gv-appbar-user { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 0; border-radius: 6px;
    background: none; color: var(--gv-side-text); font: inherit; cursor: pointer; }
.gv-appbar-btn:hover { background: var(--gv-side-2); color: var(--gv-side-active); }
.gv-appbar-user { cursor: default; }
.gv-appbar-btn svg, .gv-appbar-user svg { font-size: 16px; }

.gv-page { position: absolute; inset: 0; }
.gv-page-main { position: absolute; left: 0; right: 0; bottom: 0; top: var(--gv-appbar-height); overflow: auto; display: flex; flex-direction: column; }

/* ---------------------------------------------------------------- NEW: hero */
.gv-home-hero {
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--gv-border);
    background:
        radial-gradient(1200px 420px at 85% -10%, color-mix(in srgb, var(--gv-accent) 22%, transparent), transparent 70%),
        linear-gradient(180deg, var(--gv-surface) 0%, var(--gv-bg) 100%);
}
.gv-home-hero-contours { position: absolute; right: -60px; top: -40px; width: 720px; height: 420px; color: var(--gv-accent); opacity: .22; pointer-events: none; }
[data-theme="dark"] .gv-home-hero-contours { opacity: .28; }
.gv-home-hero-inner { position: relative; max-width: 1000px; margin: 0 auto; padding: 56px 24px 48px; }
.gv-home-logo { height: 44px; margin-bottom: 18px; display: block; }
.gv-home-hero h1 { margin: 0 0 10px; font-size: 34px; font-weight: 600; letter-spacing: -.01em; }
.gv-home-welcome { margin: 0 0 6px; max-width: 620px; font-size: 16px; line-height: 1.5; color: var(--gv-text); opacity: .85; white-space: pre-line; }
.gv-home-meta { margin: 0; font-size: 13px; color: var(--gv-muted); }
.gv-home-meta b { color: var(--gv-text); font-weight: 600; }

.gv-home-cta { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-top: 26px; }
.gv-btn-primary { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 22px; border: 0; border-radius: 8px;
    background: var(--gv-accent); color: var(--gv-accent-text); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--gv-accent) 35%, transparent); transition: transform .15s, filter .15s; }
.gv-btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
.gv-btn-primary svg { font-size: 20px; }
.gv-home-cta-hint { font-size: 13px; color: var(--gv-muted); }

/* no access */
.gv-home-notice { display: flex; gap: 14px; margin-top: 26px; max-width: 620px; padding: 16px 18px; border-radius: 10px;
    background: var(--gv-warn-soft); border: 1px solid color-mix(in srgb, var(--gv-warn) 40%, transparent); }
.gv-home-notice > svg { font-size: 22px; color: var(--gv-warn); margin-top: 1px; }
.gv-home-notice b { display: block; margin-bottom: 4px; font-size: 15px; }
.gv-home-notice p { margin: 0; color: var(--gv-text); opacity: .85; line-height: 1.5; white-space: pre-line; }
.gv-home-notice .gv-link { display: inline-block; margin-top: 8px; }

/* ---------------------------------------------------------------- sections + cards */
.gv-home-body { flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 32px 24px 40px; }
.gv-home-section-title { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gv-muted); }
.gv-home-section + .gv-home-section { margin-top: 32px; }

.gv-home-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.gv-home-card { position: relative; display: flex; flex-direction: column; gap: 6px; min-height: 180px; padding: 22px;
    background: var(--gv-surface); color: var(--gv-text); border: 1px solid var(--gv-border); border-radius: 12px;
    box-shadow: var(--gv-shadow); cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s; }
.gv-home-card:hover { border-color: var(--gv-accent); transform: translateY(-2px); box-shadow: var(--gv-float-shadow); }
.gv-home-card-icon { width: 48px; height: 48px; padding: 11px; margin-bottom: 8px; border-radius: 10px; background: var(--gv-accent-soft); color: var(--gv-accent); }
.gv-home-card-title { font-size: 17px; font-weight: 600; }
.gv-home-card-text { font-size: 13px; line-height: 1.45; color: var(--gv-muted); }
.gv-home-card-foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--gv-accent); }
.gv-home-card-open { position: absolute; right: 12px; top: 12px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--gv-muted); }
.gv-home-card-open:hover { background: var(--gv-accent-hover); color: var(--gv-accent); }

/* locked */
.gv-home-card.locked .gv-home-card-icon { background: var(--gv-surface-2); color: var(--gv-muted); }
.gv-home-card.locked .gv-home-card-foot { color: var(--gv-muted); font-weight: 500; }
.gv-home-card.locked:hover .gv-home-card-foot { color: var(--gv-accent); }
.gv-home-badge { position: absolute; right: 14px; top: 14px; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px;
    border-radius: 11px; background: var(--gv-surface-2); border: 1px solid var(--gv-border); color: var(--gv-muted); font-size: 11px; font-weight: 600; }
.gv-home-badge svg { font-size: 12px; }

/* custom tiles bring their own colours */
.gv-home-card.custom { border-color: transparent; }
.gv-home-card.custom .gv-home-card-text, .gv-home-card.custom .gv-home-card-foot, .gv-home-card.custom .gv-home-card-open { color: inherit; opacity: .85; }
.gv-home-card.custom .gv-home-card-icon { background: rgba(255,255,255,.18); color: inherit; }

/* system (admin) */
.gv-home-system { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
.gv-home-stat { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--gv-surface); border: 1px solid var(--gv-border); border-radius: 12px; }
.gv-home-stat svg { font-size: 22px; color: var(--gv-muted); }
.gv-home-stat .v { font-size: 20px; font-weight: 600; }
.gv-home-stat .l { font-size: 12px; color: var(--gv-muted); }
.gv-btn-outline { margin-left: auto; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--gv-border); background: none; color: var(--gv-text); font: inherit; font-size: 12px; cursor: pointer; }
.gv-btn-outline:hover { border-color: var(--gv-accent); color: var(--gv-accent); }
.gv-home-warn { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--gv-danger-soft); border: 1px solid color-mix(in srgb, var(--gv-danger) 35%, transparent); }
.gv-home-warn svg { font-size: 20px; color: var(--gv-danger); margin-top: 1px; }
.gv-home-warn b { display: block; margin-bottom: 2px; }
.gv-home-warn span { font-size: 13px; color: var(--gv-muted); }
@media (max-width: 700px) { .gv-home-system { grid-template-columns: 1fr; } .gv-home-hero h1 { font-size: 28px; } }

/* footer */
.gv-home-footer { border-top: 1px solid var(--gv-border); }
.gv-home-footer-inner { max-width: 1000px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; font-size: 12px; color: var(--gv-muted); }
.gv-home-footer-inner .sp { flex: 1; }
.gv-link { color: var(--gv-accent); text-decoration: none; }
.gv-link:hover { text-decoration: underline; }
.gv-home-footer-inner .gv-link { color: var(--gv-muted); }
.gv-home-footer-inner .gv-link:hover { color: var(--gv-accent); }

/* ---------------------------------------------------------------- prototype switcher (not part of the design) */
.proto { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 100; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 8px 10px; border-radius: 10px; background: #222; color: #ddd; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.proto b { margin: 0 4px 0 8px; color: #fff; }
.proto button { border: 1px solid #555; background: #333; color: #ddd; border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; }
.proto button.on { background: #ff9800; border-color: #ff9800; color: #000; }
.toast { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: #222; color: #fff; font: 12px monospace; opacity: 0; transition: opacity .2s; z-index: 101; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<div class="proto">
    <b>State</b>
    <button data-state="anon">Anonymous</button>
    <button data-state="user">User</button>
    <button data-state="noaccess">No access</button>
    <button data-state="admin">Admin</button>
    <button data-state="noauth">No auth config</button>
    <b>Theme</b>
    <button data-theme-btn="light">Light</button>
    <button data-theme-btn="dark">Dark</button>
    <b>Config</b>
    <button data-branding="0">Default</button>
    <button data-branding="1">Branded</button>
</div>

<script>
const P = {
    map: "M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z",
    folder: "M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z",
    lock: "M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z",
    login: "M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z",
    logout: "M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z",
    memory: "M15 9H9v6h6V9zm-2 4h-2v-2h2v2zm8-2V9h-2V7c0-1.1-.9-2-2-2h-2V3h-2v2h-2V3H9v2H7c-1.1 0-2 .9-2 2v2H3v2h2v2H3v2h2v2c0 1.1.9 2 2 2h2v2h2v-2h2v2h2v-2h2c1.1 0 2-.9 2-2v-2h2v-2h-2v-2h2zm-4 6H7V7h10v10z",
    apps: "M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z",
    open: "M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z",
    warn: "M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z",
    person: "M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z",
    contrast: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93V4.07c3.94.49 7 3.85 7 7.93s-3.06 7.44-7 7.93z",
    block: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM4 12c0-4.42 3.58-8 8-8 1.85 0 3.55.63 4.9 1.69L5.69 16.9C4.63 15.55 4 13.85 4 12zm8 8c-1.85 0-3.55-.63-4.9-1.69L18.31 7.1C19.37 8.45 20 10.15 20 12c0 4.42-3.58 8-8 8z",
    arrow: "M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"
};
const ic = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;

// contour lines: concentric, slightly irregular rings around two "hills" (static, generated once)
function contours() {
    const hill = (cx, cy, rx, ry, n, seed) => {
        let out = "";
        for (let k = 1; k <= n; k++) {
            const s = k / n, pts = [];
            for (let a = 0; a < 48; a++) {
                const t = a / 48 * Math.PI * 2;
                const wob = 1 + .10 * Math.sin(3 * t + seed + k * .35) + .06 * Math.sin(5 * t - seed * 2 + k * .2);
                pts.push([cx + Math.cos(t) * rx * s * wob, cy + Math.sin(t) * ry * s * wob]);
            }
            let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
            for (let i = 0; i < pts.length; i++) {
                const p0 = pts[(i - 1 + pts.length) % pts.length], p1 = pts[i], p2 = pts[(i + 1) % pts.length], p3 = pts[(i + 2) % pts.length];
                const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
                d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
            }
            out += `<path d="${d}Z" stroke-width="${k % 4 === 0 ? 1.6 : .9}"/>`;
        }
        return out;
    };
    return `<svg class="gv-home-hero-contours" viewBox="0 0 720 420" fill="none" stroke="currentColor">${hill(430, 170, 330, 230, 14, 1.3)}${hill(620, 330, 160, 120, 7, 4.1)}</svg>`;
}
const CONTOURS = contours();

const cfg = {
    0: { title: "gView GIS", welcome: "Create maps, explore and manage geographic data – right in your browser.", logo: null,
         noAccess: "Please contact your administrator.", links: [["Documentation", "https://docs.gviewonline.com"], ["GitHub", "https://github.com/jugstalt/gview-gis"]] },
    1: { title: "GIS Stadtwerke Musterstadt", welcome: "Willkommen im GIS-Portal der Stadtwerke.\nMelde dich mit deinem Firmenkonto an, um Karten zu bearbeiten.", logo: true,
         noAccess: "Für den Zugriff wird die Rolle „GIS-Anwender“ benötigt.\nBitte beim GIS-Team anfragen: gis@stadtwerke.example", links: [["GIS-Handbuch", "#"], ["Intranet", "#"], ["Support", "#"]] }
};
const customTiles = [
    { title: "Stadtplan", text: "Öffentlicher Stadtplan mit Adresssuche", bg: "#0f766e", fg: "#fff", vis: "public" },
    { title: "Leitungsauskunft", text: "Auskunft für Fremdfirmen und Planer", bg: "#7c3aed", fg: "#fff", vis: "user" },
    { title: "Server Admin", text: "gView Server – services and cache", bg: "#334155", fg: "#fff", vis: "admin" }
];

let state = "anon", theme = "dark", branding = 0;

function render() {
    const c = cfg[branding];
    const authed = state !== "anon" && state !== "noauth";
    const isUser = state === "user" || state === "admin" || state === "noauth";
    const isAdmin = state === "admin" || state === "noauth";
    const name = state === "admin" ? "Anna Admin" : "Max Mustermann";
    const role = state === "admin" ? "administrator" : state === "user" ? "user" : "no role";
    const level = state === "anon" ? "public" : state === "noaccess" ? "public" : isAdmin ? "admin" : "user";
    const rank = { public: 0, user: 1, admin: 2 };

    // app bar
    let right = `<button class="gv-appbar-btn">${ic("contrast")}<span>${theme === "dark" ? "Dark" : "Light"}</span></button>`;
    if (authed) right += `<span class="gv-appbar-user" title="${name} (${role})">${ic("person")}<span>${name}</span></span><a class="gv-appbar-btn" href="#" title="Logout">${ic("logout")}</a>`;
    else if (state === "anon") right += `<a class="gv-appbar-btn" href="#" data-go="login">${ic("login")}<span>Login</span></a>`;

    // hero
    let hero = "";
    if (state === "anon") {
        hero = `<div class="gv-home-cta">
                    <a class="gv-btn-primary" href="#" data-go="login">${ic("login")}Sign in</a>
                    <span class="gv-home-cta-hint">Sign in to open gView Carto and gView Explorer.</span>
                </div>`;
    } else if (state === "noaccess") {
        hero = `<div class="gv-home-notice">${ic("block")}<div>
                    <b>No permission for gView</b>
                    <p>You are signed in as <strong>${name}</strong>, but this account has no gView role.\n${c.noAccess}</p>
                    <a class="gv-link" href="#">Sign in with another account</a>
                </div></div>`;
    }
    const meta = authed && state !== "noaccess"
        ? `Signed in as <b>${name}</b> · ${role} · Version 9.26.4306`
        : `Version 9.26.4306`;

    // app tiles
    const tile = (icon, title, text, uri, needs) => {
        const locked = rank[level] < rank[needs];
        if (state === "noaccess") return "";                         // nothing to open: the notice says why
        if (locked && state !== "anon") return "";                   // signed in users don't see what they can never open
        if (locked) return `<div class="gv-home-card locked" data-go="login?returnUrl=${uri}">
                ${ic(icon, "gv-home-card-icon")}
                <span class="gv-home-badge">${ic("lock")}${needs === "admin" ? "Admin" : "Sign in"}</span>
                <span class="gv-home-card-title">${title}</span>
                <span class="gv-home-card-text">${text}</span>
                <span class="gv-home-card-foot">${needs === "admin" ? "Administrators only – sign in" : "Sign in to open"} ${ic("arrow")}</span>
            </div>`;
        return `<div class="gv-home-card" data-go="${uri}">
                ${ic(icon, "gv-home-card-icon")}
                <span class="gv-home-card-open" title="Open in a new tab">${ic("open")}</span>
                <span class="gv-home-card-title">${title}</span>
                <span class="gv-home-card-text">${text}</span>
                <span class="gv-home-card-foot">Open ${ic("arrow")}</span>
            </div>`;
    };
    let tiles = tile("map", "gView Carto", "Create maps, include geographic data sources, render with cartographic capabilities", "carto", "user")
              + tile("folder", "gView Explorer", "Explore geographic data, copy data between datasets, run workloads to manage your data", "explorer", "admin");
    for (const t of (branding ? customTiles : [])) {
        if (rank[level] < rank[t.vis]) continue;
        tiles += `<div class="gv-home-card custom" style="background:${t.bg};color:${t.fg}" data-go="${t.title}">
                ${ic("apps", "gv-home-card-icon")}
                <span class="gv-home-card-open">${ic("open")}</span>
                <span class="gv-home-card-title">${t.title}</span>
                <span class="gv-home-card-text">${t.text}</span>
                <span class="gv-home-card-foot">Open ${ic("arrow")}</span>
            </div>`;
    }

    let body = "";
    if (tiles) body += `<section class="gv-home-section"><h2 class="gv-home-section-title">Applications</h2><div class="gv-home-cards">${tiles}</div></section>`;
    if (isAdmin) {
        body += `<section class="gv-home-section"><h2 class="gv-home-section-title">System</h2><div class="gv-home-system">
                    <div class="gv-home-stat">${ic("memory")}<div><div class="v">412 MB</div><div class="l">Used memory</div></div><button class="gv-btn-outline">Collect</button></div>
                    ${state === "noauth" ? `<div class="gv-home-warn">${ic("warn")}<div><b>No authentication configured</b><span>Everyone who can reach this site has administrator rights. Configure OIDC or forms login before exposing gView to a network.</span></div></div>` : ""}
                </div></section>`;
    }

    const logo = c.logo
        ? `<svg class="gv-home-logo" viewBox="0 0 200 44"><rect width="44" height="44" rx="10" fill="#0f766e"/><path d="M12 30 L22 12 L32 30 Z" fill="#fff"/><text x="56" y="29" font-size="18" font-weight="700" fill="currentColor" font-family="Segoe UI, sans-serif">Stadtwerke</text></svg>`
        : "";

    document.getElementById("app").innerHTML = `
    <div class="gv-page">
        <header class="gv-appbar">
            <a class="gv-brand" href="#"><svg class="i gv-brand-mark" viewBox="0 0 24 24"><path d="${P.map}"/></svg><span>gView</span><em>v9</em></a>
            <div class="gv-appbar-center"></div>
            <div class="gv-appbar-right">${right}</div>
        </header>
        <main class="gv-page-main">
            <div class="gv-home-hero">
                ${CONTOURS}
                <div class="gv-home-hero-inner">
                    ${logo}
                    <h1>${c.title}</h1>
                    <p class="gv-home-welcome">${c.welcome}</p>
                    <p class="gv-home-meta">${meta}</p>
                    ${hero}
                </div>
            </div>
            <div class="gv-home-body">${body}</div>
            <footer class="gv-home-footer"><div class="gv-home-footer-inner">
                <span>gView GIS · 9.26.4306</span><span class="sp"></span>
                ${c.links.map(l => `<a class="gv-link" href="${l[1]}" target="_blank">${l[0]}</a>`).join("")}
            </div></footer>
        </main>
    </div>`;

    document.documentElement.dataset.theme = theme;
    document.querySelectorAll("[data-state]").forEach(b => b.classList.toggle("on", b.dataset.state === state));
    document.querySelectorAll("[data-theme-btn]").forEach(b => b.classList.toggle("on", b.dataset.themeBtn === theme));
    document.querySelectorAll("[data-branding]").forEach(b => b.classList.toggle("on", +b.dataset.branding === branding));
}

let toastTimer;
document.addEventListener("click", e => {
    const s = e.target.closest("[data-state]"), t = e.target.closest("[data-theme-btn]"), b = e.target.closest("[data-branding]"), g = e.target.closest("[data-go]");
    if (s) { state = s.dataset.state; render(); }
    else if (t) { theme = t.dataset.themeBtn; render(); }
    else if (b) { branding = +b.dataset.branding; render(); }
    else if (g) {
        e.preventDefault();
        const el = document.getElementById("toast");
        el.textContent = "→ navigate to /" + g.dataset.go;
        el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
    }
});
render();
</script>
</body>
</html>
